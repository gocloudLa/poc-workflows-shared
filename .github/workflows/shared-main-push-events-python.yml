name: "Shared Main Push Events (Python)"

on:
  workflow_call:
    inputs:
      # Service configuration
      service_name:
        description: 'Service name'
        required: false
        type: string
        default: ''
      target_repository:
        description: 'ArgoCD repository to update (owner/repo)'
        required: false
        type: string
        default: 'gocloudLa/poc-workflows-argocd-shared'
      target_branch:
        description: 'Target branch to update in ArgoCD repo'
        required: false
        type: string
        default: 'main'
      values_dir:
        description: 'Values folder inside ArgoCD repo'
        required: false
        type: string
        default: 'poc-workflows-python-repo'
      
      # Skip flags
      skip_release:
        required: false
        type: boolean
        default: false
      skip_build:
        required: false
        type: boolean
        default: false
      skip_staging_deploy:
        required: false
        type: boolean
        default: false
      skip_staging_validation:
        required: false
        type: boolean
        default: false
      skip_prod_deploy:
        required: false
        type: boolean
        default: false
      skip_prod_verification:
        required: false
        type: boolean
        default: false
      skip_prod_health_check:
        required: false
        type: boolean
        default: false

concurrency:
  group: shared-main-push-events-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-and-changelog:
    uses: ./.github/workflows/release-and-changelog.yml
    with:
      release_type: python
      skip_execution: ${{ inputs.skip_release }}
    secrets: inherit

  build-and-push:
    needs: release-and-changelog
    uses: ./.github/workflows/build-and-push.yml
    with:
      service_name: ${{ inputs.service_name }}
      branch: main
      version_tag: ${{ needs.release-and-changelog.outputs.tag_name }}
      skip_execution: ${{ inputs.skip_build }}
    secrets: inherit

  deploy-staging:
    needs: build-and-push
    uses: ./.github/workflows/deploy.yml
    with:
      target_repository: ${{ inputs.target_repository }}
      target_branch: ${{ inputs.target_branch }}
      values_dir: ${{ inputs.values_dir }}
      environment: staging
      values_file: values.stg.yml
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      skip_execution: ${{ inputs.skip_staging_deploy }}
    secrets: inherit

  staging-verification:
    needs: deploy-staging
    uses: ./.github/workflows/deploy-verification.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: staging
      skip_execution: ${{ inputs.skip_staging_validation }}
    secrets: inherit

  staging-health-check:
    needs: staging-verification
    uses: ./.github/workflows/health-check.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: staging
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      skip_execution: ${{ inputs.skip_staging_validation }}
    secrets: inherit

  staging-validation:
    needs: staging-health-check
    uses: ./.github/workflows/staging-validation.yml
    with:
      service_name: ${{ inputs.service_name }}
      skip_execution: ${{ inputs.skip_staging_validation }}
    secrets: inherit

  rollback-mechanism-staging:
    if: failure() && needs.staging-validation.result == 'failure'
    needs: [build-and-push, staging-validation]
    uses: ./.github/workflows/rollback-mechanism.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: staging
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
    secrets: inherit

  save-production-version:
    needs: [build-and-push, staging-validation]
    if: success()
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ needs.build-and-push.outputs.version_tag }}
    steps:
      - name: Save Production Version
        run: |
          VERSION_TAG="${{ needs.build-and-push.outputs.version_tag }}"
          echo "Version $VERSION_TAG is ready for production deployment"
          echo "This version has passed all staging validations"
          echo ""
          echo "📦 To deploy to production:"
          echo "1. Go to Actions tab: https://github.com/${{ github.repository }}/actions"
          echo "2. Select 'Create Release' workflow"
          echo "3. Click 'Run workflow' and use tag: $VERSION_TAG"
          echo "4. The release event will trigger the production deployment workflow"

  workflow-summary:
    if: always()
    runs-on: ubuntu-latest
    needs: [release-and-changelog, build-and-push, deploy-staging, staging-validation, save-production-version]
    steps:
      - name: Workflow Summary
        run: |
          echo "## Main Branch Deployment Summary (Python)" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release & Changelog | ${{ needs.release-and-changelog.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.release-and-changelog.outputs.tag_name }}" != "" ]; then
            echo "| Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Deploy to Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Staging Validation | ${{ needs.staging-validation.result }} |" >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "📦 **Next Step**: Create a GitHub Release to deploy to Production" >> $GITHUB_STEP_SUMMARY
            echo "Tag created: ${{ needs.release-and-changelog.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build & Push | skipped (no new tag) |" >> $GITHUB_STEP_SUMMARY
            echo "| Deploy to Staging | skipped (no new tag) |" >> $GITHUB_STEP_SUMMARY
            echo "| Staging Validation | skipped (no new tag) |" >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "ℹ️ **No new tag created** - This is normal if:" >> $GITHUB_STEP_SUMMARY
            echo "   - There are no changes since the last release" >> $GITHUB_STEP_SUMMARY
            echo "   - Commits don't follow Conventional Commits format" >> $GITHUB_STEP_SUMMARY
            echo "   - Version already exists" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ Deployment failed or was cancelled"
            exit 1
          elif [ "${{ needs.release-and-changelog.outputs.tag_name }}" = "" ]; then
            echo "ℹ️ Workflow completed - no new release needed"
            exit 0
          else
            echo "✅ Deployment completed successfully"
          fi
