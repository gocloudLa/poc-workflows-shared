name: Python Linter

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  python-linter:
    name: Python Linter
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          pip install pylint flake8 black

      - name: Run Pylint
        continue-on-error: true
        run: |
          if [ -f "pylintrc" ] || [ -f ".pylintrc" ]; then
            pylint **/*.py || echo "Pylint found issues (non-blocking)"
          else
            echo "Pylint configuration not found, running with defaults"
            pylint **/*.py --disable=all --enable=E,F || echo "Pylint found issues (non-blocking)"
          fi

      - name: Run Flake8
        continue-on-error: true
        run: |
          if [ -f ".flake8" ] || [ -f "setup.cfg" ]; then
            flake8 . || echo "Flake8 found issues (non-blocking)"
          else
            echo "Flake8 configuration not found, running with defaults"
            flake8 . --max-line-length=120 --exclude=.git,__pycache__,venv || echo "Flake8 found issues (non-blocking)"
          fi

      - name: Check Black Formatting
        continue-on-error: true
        run: |
          black --check . || echo "Black formatting check failed (non-blocking)"

