name: "Shared Develop Push Events"

on:
  workflow_call:
    inputs:
      # AWS Configuration
      ecr_repository_url:
        description: 'ECR repository URL'
        required: true
        type: string
      aws_role_arn_shared:
        description: 'AWS IAM role ARN for ECR access'
        required: true
        type: string
      aws_role_arn_dev:
        description: 'AWS IAM role ARN for dev environment'
        required: true
        type: string
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'us-east-1'
      
      # Service configuration
      service_name:
        description: 'Service name'
        required: false
        type: string
        default: ''
      
      # Language
      language:
        description: 'Programming language (php, python)'
        required: true
        type: string
      
      # Skip flags
      skip_security_scan:
        required: false
        type: boolean
        default: false
      skip_build:
        required: false
        type: boolean
        default: false
      skip_deploy:
        required: false
        type: boolean
        default: false
      skip_deploy_verification:
        required: false
        type: boolean
        default: false
      skip_health_check:
        required: false
        type: boolean
        default: false

concurrency:
  group: shared-develop-push-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan-php:
    if: ${{ !inputs.skip_security_scan && inputs.language == 'php' }}
    uses: ./.github/workflows/security-scan-php.yml
    with:
      skip_execution: ${{ inputs.skip_security_scan }}
    secrets: inherit

  security-scan-python:
    if: ${{ !inputs.skip_security_scan && inputs.language == 'python' }}
    uses: ./.github/workflows/security-scan-python.yml
    with:
      skip_execution: ${{ inputs.skip_security_scan }}
    secrets: inherit

  security-scan-complete:
    if: always()
    needs: [security-scan-php, security-scan-python]
    runs-on: ubuntu-latest
    steps:
      - name: Check security scan results
        run: |
          PHP_RESULT="${{ needs.security-scan-php.result }}"
          PYTHON_RESULT="${{ needs.security-scan-python.result }}"
          
          if [ "${{ inputs.language }}" = "php" ]; then
            if [ "$PHP_RESULT" != "success" ] && [ "$PHP_RESULT" != "skipped" ]; then
              echo "❌ PHP security scan failed"
              exit 1
            fi
          elif [ "${{ inputs.language }}" = "python" ]; then
            if [ "$PYTHON_RESULT" != "success" ] && [ "$PYTHON_RESULT" != "skipped" ]; then
              echo "❌ Python security scan failed"
              exit 1
            fi
          fi
          echo "✅ Security scan validation passed"

  build-and-push:
    needs: security-scan-complete
    uses: ./.github/workflows/build-and-push.yml
    with:
      ecr_repository_url: ${{ inputs.ecr_repository_url }}
      aws_role_arn: ${{ inputs.aws_role_arn_shared }}
      aws_region: ${{ inputs.aws_region }}
      service_name: ${{ inputs.service_name }}
      branch: develop
      skip_execution: ${{ inputs.skip_build }}
    secrets: inherit

  deploy-dev:
    needs: build-and-push
    uses: ./.github/workflows/deploy-dev.yml
    with:
      ecr_repository_url: ${{ inputs.ecr_repository_url }}
      aws_role_arn: ${{ inputs.aws_role_arn_dev }}
      aws_region: ${{ inputs.aws_region }}
      service_name: ${{ inputs.service_name }}
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      skip_execution: ${{ inputs.skip_deploy }}
    secrets: inherit

  deploy-verification:
    needs: deploy-dev
    uses: ./.github/workflows/deploy-verification.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: dev
      skip_execution: ${{ inputs.skip_deploy_verification }}
    secrets: inherit

  health-check:
    needs: deploy-verification
    uses: ./.github/workflows/health-check.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: dev
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      skip_execution: ${{ inputs.skip_health_check }}
    secrets: inherit

  workflow-summary:
    if: always()
    runs-on: ubuntu-latest
    needs: [security-scan-complete, build-and-push, deploy-dev, deploy-verification, health-check]
    steps:
      - name: Workflow Summary
        run: |
          echo "## Develop Branch Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.security-scan-php.result }}" != "skipped" ] && [ "${{ needs.security-scan-php.result }}" != "" ]; then
            echo "| Security Scan (PHP) | ${{ needs.security-scan-php.result }} |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security-scan-python.result }}" != "skipped" ] && [ "${{ needs.security-scan-python.result }}" != "" ]; then
            echo "| Security Scan (Python) | ${{ needs.security-scan-python.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Scan | skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Dev | ${{ needs.deploy-dev.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Verification | ${{ needs.deploy-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ Deployment failed or was cancelled"
            exit 1
          else
            echo "✅ Deployment completed successfully"
          fi

