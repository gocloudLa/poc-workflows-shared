name: "Shared Develop Push Events (Python)"

on:
  workflow_call:
    inputs:
      # Service configuration
      service_name:
        description: 'Service name'
        required: false
        type: string
        default: ''
      
      # Skip flags
      skip_security_scan:
        required: false
        type: boolean
        default: false
      skip_build:
        required: false
        type: boolean
        default: false
      skip_deploy:
        required: false
        type: boolean
        default: false
      skip_deploy_verification:
        required: false
        type: boolean
        default: false
      skip_health_check:
        required: false
        type: boolean
        default: false

concurrency:
  group: shared-develop-push-events-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    if: ${{ !inputs.skip_security_scan }}
    uses: ./.github/workflows/security-scan-python.yml
    with:
      skip_execution: ${{ inputs.skip_security_scan }}
    secrets: inherit

  build-and-push:
    needs: security-scan
    uses: ./.github/workflows/build-and-push.yml
    with:
      service_name: ${{ inputs.service_name }}
      branch: develop
      skip_execution: ${{ inputs.skip_build }}
    secrets: inherit

  deploy-dev:
    needs: build-and-push
    uses: ./.github/workflows/deploy-dev.yml
    with:
      service_name: ${{ inputs.service_name }}
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      skip_execution: ${{ inputs.skip_deploy }}
    secrets: inherit

  deploy-verification:
    needs: deploy-dev
    uses: ./.github/workflows/deploy-verification.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: dev
      skip_execution: ${{ inputs.skip_deploy_verification }}
    secrets: inherit

  health-check:
    needs: deploy-verification
    uses: ./.github/workflows/health-check.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: dev
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      skip_execution: ${{ inputs.skip_health_check }}
    secrets: inherit

  workflow-summary:
    if: always()
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-push, deploy-dev, deploy-verification, health-check]
    steps:
      - name: Workflow Summary
        run: |
          echo "## Develop Branch Deployment Summary (Python)" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan (Python) | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Dev | ${{ needs.deploy-dev.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Verification | ${{ needs.deploy-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ Deployment failed or was cancelled"
            exit 1
          else
            echo "✅ Deployment completed successfully"
          fi

