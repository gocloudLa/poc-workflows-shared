name: "Shared Pull Request Events"

on:
  workflow_call:
    inputs:
      # Language detection
      language:
        description: 'Programming language (php, python, javascript, go). Auto-detected if not provided'
        required: false
        type: string
        default: ''
      
      # Skip flags
      skip_conventional_commit:
        required: false
        type: boolean
        default: false
      skip_linter:
        required: false
        type: boolean
        default: false
      skip_security_scan:
        required: false
        type: boolean
        default: false
      skip_unit_tests:
        required: false
        type: boolean
        default: false
      skip_coverage_validation:
        required: false
        type: boolean
        default: false
      
      # Conventional commit configuration
      conventional_commit_types:
        description: 'Allowed PR types for conventional commits'
        required: false
        type: string
        default: 'fix feat ci chore'
      require_scope:
        description: 'Whether to require a scope in conventional commits'
        required: false
        type: boolean
        default: false
      
      # Coverage configuration
      coverage_threshold:
        description: 'Minimum coverage percentage required'
        required: false
        type: number
        default: 80

concurrency:
  group: shared-pull-request-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commit-check:
    uses: ./.github/workflows/conventional-commit-check.yml
    with:
      types: ${{ inputs.conventional_commit_types }}
      requireScope: ${{ inputs.require_scope }}
      skip_execution: ${{ inputs.skip_conventional_commit }}
    secrets: inherit

  detect-language:
    if: ${{ inputs.language == '' }}
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.detect.outputs.language }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Language
        id: detect
        run: |
          if [ -f "composer.json" ]; then
            echo "language=php" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "language=javascript" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            echo "language=python" >> $GITHUB_OUTPUT
          elif [ -f "go.mod" ]; then
            echo "language=go" >> $GITHUB_OUTPUT
          else
            echo "language=unknown" >> $GITHUB_OUTPUT
          fi

  determine-language:
    runs-on: ubuntu-latest
    needs: detect-language
    if: always()
    outputs:
      language: ${{ steps.determine.outputs.language }}
    steps:
      - name: Determine Language
        id: determine
        run: |
          if [ "${{ inputs.language }}" != "" ]; then
            echo "language=${{ inputs.language }}" >> $GITHUB_OUTPUT
          elif [ "${{ needs.detect-language.result }}" == "success" ]; then
            echo "language=${{ needs.detect-language.outputs.language }}" >> $GITHUB_OUTPUT
          else
            echo "language=unknown" >> $GITHUB_OUTPUT
          fi

  linter-php:
    needs: determine-language
    if: ${{ !inputs.skip_linter && needs.determine-language.outputs.language == 'php' }}
    uses: ./.github/workflows/linter-php.yml
    with:
      skip_execution: ${{ inputs.skip_linter }}
    secrets: inherit

  linter-python:
    needs: determine-language
    if: ${{ !inputs.skip_linter && needs.determine-language.outputs.language == 'python' }}
    uses: ./.github/workflows/linter-python.yml
    with:
      skip_execution: ${{ inputs.skip_linter }}
    secrets: inherit

  linter-javascript:
    needs: determine-language
    if: ${{ !inputs.skip_linter && needs.determine-language.outputs.language == 'javascript' }}
    uses: ./.github/workflows/linter-javascript.yml
    with:
      skip_execution: ${{ inputs.skip_linter }}
    secrets: inherit

  linter-go:
    needs: determine-language
    if: ${{ !inputs.skip_linter && needs.determine-language.outputs.language == 'go' }}
    uses: ./.github/workflows/linter-go.yml
    with:
      skip_execution: ${{ inputs.skip_linter }}
    secrets: inherit

  security-scan:
    uses: ./.github/workflows/security-scan.yml
    with:
      skip_execution: ${{ inputs.skip_security_scan }}
    secrets: inherit

  unit-tests:
    needs: determine-language
    if: ${{ !inputs.skip_unit_tests && needs.determine-language.outputs.language != 'unknown' }}
    uses: ./.github/workflows/unit-tests.yml
    with:
      language: ${{ needs.determine-language.outputs.language }}
      skip_execution: ${{ inputs.skip_unit_tests }}
    secrets: inherit

  coverage-validation:
    needs: [determine-language, unit-tests]
    if: ${{ !inputs.skip_coverage_validation && needs.determine-language.outputs.language != 'unknown' }}
    uses: ./.github/workflows/coverage-validation.yml
    with:
      language: ${{ needs.determine-language.outputs.language }}
      threshold: ${{ inputs.coverage_threshold }}
      skip_execution: ${{ inputs.skip_coverage_validation }}
    secrets: inherit

  workflow-summary:
    if: always()
    runs-on: ubuntu-latest
    needs: [conventional-commit-check, linter-php, linter-python, linter-javascript, linter-go, security-scan, unit-tests, coverage-validation]
    steps:
      - name: Workflow Summary
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Conventional Commit | ${{ needs.conventional-commit-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Determine which linter ran
          if [ "${{ needs.linter-php.result }}" != "skipped" ]; then
            echo "| Linter (PHP) | ${{ needs.linter-php.result }} |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.linter-python.result }}" != "skipped" ]; then
            echo "| Linter (Python) | ${{ needs.linter-python.result }} |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.linter-javascript.result }}" != "skipped" ]; then
            echo "| Linter (JavaScript) | ${{ needs.linter-javascript.result }} |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.linter-go.result }}" != "skipped" ]; then
            echo "| Linter (Go) | ${{ needs.linter-go.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Linter | skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Validation | ${{ needs.coverage-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ Workflow failed or was cancelled"
            exit 1
          else
            echo "✅ All checks passed"
          fi

