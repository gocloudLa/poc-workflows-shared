name: "Shared Release Events"

on:
  workflow_call:
    inputs:
      # Service configuration
      service_name:
        description: 'Service name'
        required: false
        type: string
        default: ''
      target_repository:
        description: 'ArgoCD repository to update (owner/repo)'
        required: false
        type: string
        default: 'gocloudLa/poc-workflows-argocd-shared'
      target_branch:
        description: 'Target branch to update in ArgoCD repo'
        required: false
        type: string
        default: 'main'
      values_dir:
        description: 'Values folder inside ArgoCD repo (poc-workflows-python-repo or poc-workflows-php-repo)'
        required: true
        type: string
      
      # Release information
      release_tag:
        description: 'Release tag name (e.g., v1.2.0)'
        required: true
        type: string
      
      # Skip flags
      skip_prod_deploy:
        required: false
        type: boolean
        default: false
      skip_prod_verification:
        required: false
        type: boolean
        default: false
      skip_prod_health_check:
        required: false
        type: boolean
        default: false

concurrency:
  group: shared-release-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    if: ${{ !inputs.skip_prod_deploy }}
    uses: ./.github/workflows/deploy.yml
    with:
      target_repository: ${{ inputs.target_repository }}
      target_branch: ${{ inputs.target_branch }}
      values_dir: ${{ inputs.values_dir }}
      environment: prd
      values_file: values.prd.yml
      image_tag: ${{ inputs.release_tag }}
      skip_execution: ${{ inputs.skip_prod_deploy }}
    secrets: inherit

  production-verification:
    needs: deploy-production
    if: ${{ !inputs.skip_prod_verification }}
    uses: ./.github/workflows/deploy-verification.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: prd
      skip_execution: ${{ inputs.skip_prod_verification }}
    secrets: inherit

  production-health-check:
    needs: production-verification
    if: ${{ !inputs.skip_prod_health_check }}
    uses: ./.github/workflows/health-check.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: prd
      image_tag: ${{ inputs.release_tag }}
      skip_execution: ${{ inputs.skip_prod_health_check }}
    secrets: inherit

  rollback-mechanism-production:
    if: failure() && needs.production-health-check.result == 'failure'
    needs: [deploy-production, production-health-check]
    uses: ./.github/workflows/rollback-mechanism.yml
    with:
      service_name: ${{ inputs.service_name }}
      environment: prd
      image_tag: ${{ inputs.release_tag }}
    secrets: inherit

  workflow-summary:
    if: always()
    runs-on: ubuntu-latest
    needs: [deploy-production, production-verification, production-health-check]
    steps:
      - name: Workflow Summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Production | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Verification | ${{ needs.production-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Health Check | ${{ needs.production-health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ Production deployment failed or was cancelled"
            exit 1
          else
            echo "✅ Production deployment completed successfully"
          fi
