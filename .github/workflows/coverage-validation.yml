name: Coverage Validation

on:
  workflow_call:
    inputs:
      language:
        description: 'Programming language'
        required: true
        type: string
      threshold:
        description: 'Minimum coverage percentage'
        required: false
        type: number
        default: 80
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  coverage-validation:
    name: Coverage Validation (${{ inputs.language }})
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PHP Coverage
        if: ${{ inputs.language == 'php' }}
        run: |
          if [ -f "coverage.xml" ]; then
            echo "Coverage file found, validating threshold of ${{ inputs.threshold }}%"
            # In a real scenario, you would parse coverage.xml and check the threshold
            echo "✅ Coverage validation passed (simulated)"
          else
            echo "⚠️ No coverage file found, skipping validation"
          fi

      - name: Validate Python Coverage
        if: ${{ inputs.language == 'python' }}
        run: |
          if [ -f "coverage.xml" ]; then
            echo "Coverage file found, validating threshold of ${{ inputs.threshold }}%"
            # In a real scenario, you would parse coverage.xml and check the threshold
            echo "✅ Coverage validation passed (simulated)"
          else
            echo "⚠️ No coverage file found, skipping validation"
          fi

