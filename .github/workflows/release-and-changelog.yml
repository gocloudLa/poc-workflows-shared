name: Release and Changelog

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Type of release (node/python/php/go) - used for semantic-release config'
        required: false
        type: string
        default: 'node'
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  release-and-changelog:
    name: Release and Changelog
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.get-tag.outputs.version }}
      tag_name: ${{ steps.get-tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
