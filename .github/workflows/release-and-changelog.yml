name: Release and Changelog

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Type of release (node/python/php/go)'
        required: false
        type: string
        default: 'node'
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  release-and-changelog:
    name: Release and Changelog
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.release_type }}
          target-branch: main

      - name: Output release status
        run: |
          if [ "${{ steps.release.outputs.release_created }}" = "true" ]; then
            echo "✅ Release created: ${{ steps.release.outputs.tag_name }}"
            echo "Version: ${{ steps.release.outputs.version }}"
          else
            echo "ℹ️ No new release created (may need to create release PR first)"
          fi

