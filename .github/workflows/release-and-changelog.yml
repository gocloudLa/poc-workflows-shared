name: Release and Changelog

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Type of release (node/python/php/go) - used for semantic-release config'
        required: false
        type: string
        default: 'node'
      skip_execution:
        required: false
        type: boolean
        default: false
    outputs:
      tag_name:
        description: 'Tag created by semantic-release'
        value: ${{ jobs.release-and-changelog.outputs.tag_name }}
      version:
        description: 'Version extracted from the created tag'
        value: ${{ jobs.release-and-changelog.outputs.version }}

jobs:
  release-and-changelog:
    name: Release and Changelog (Node)
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag_name: ${{ steps.get-tag.outputs.tag_name }}
      version: ${{ steps.get-tag.outputs.version }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACTION_BOT_APP_ID }}
          private-key: ${{ secrets.ACTION_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create package.json for semantic-release (if needed)
        run: |
          if [ ! -f "package.json" ]; then
            cat > package.json <<EOF_PKG
          {
            "name": "${{ github.repository }}",
            "version": "0.0.0",
            "private": true
          }
          EOF_PKG
          fi

      - name: Install semantic-release and plugins
        run: |
          npm install --save-dev \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Create semantic-release config
        run: |
          cat > .releaserc.json <<EOF
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              [
                "@semantic-release/changelog",
                {
                  "changelogFile": "CHANGELOG.md"
                }
              ],
              [
                "@semantic-release/git",
                {
                  "assets": ["CHANGELOG.md"],
                  "message": "chore(release): \${nextRelease.version} [skip ci]\n\n\${nextRelease.notes}"
                }
              ]
            ]
          }
          EOF

      - name: Get previous tag
        id: previous-tag
        run: |
          git fetch --tags
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag_name=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

      - name: Get created tag from semantic-release
        id: get-tag
        run: |
          # Fetch latest tags to get the one semantic-release just created
          git fetch --tags
          
          # Get the latest tag (should be the one just created by semantic-release)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          PREVIOUS_TAG="${{ steps.previous-tag.outputs.tag_name }}"
          
          if [ -n "$LATEST_TAG" ]; then
            # Check if this is a new tag (different from previous)
            if [ -n "$PREVIOUS_TAG" ] && [ "$LATEST_TAG" = "$PREVIOUS_TAG" ]; then
              echo "⚠️ Latest tag ($LATEST_TAG) is the same as previous tag"
              echo "version=" >> $GITHUB_OUTPUT
              echo "tag_name=" >> $GITHUB_OUTPUT
              exit 1
            else
              # Extract version from tag (remove 'v' prefix if present)
              VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              echo "tag_name=${LATEST_TAG}" >> $GITHUB_OUTPUT
              echo "✅ Found NEW tag created by semantic-release: ${LATEST_TAG}"
              echo "✅ Version: ${VERSION}"
              if [ -n "$PREVIOUS_TAG" ]; then
                echo "📌 Previous tag was: ${PREVIOUS_TAG}"
              fi
            fi
          else
            echo "⚠️ No tags found - semantic-release may not have created a new release"
            echo "version=" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Create PR to develop with changelog
        if: ${{ steps.get-tag.outputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG_NAME="${{ steps.get-tag.outputs.tag_name }}"
          BRANCH="chore/changelog-${TAG_NAME}"
          git checkout -b "${BRANCH}"
          git push origin "${BRANCH}"
          gh pr create \
            --base develop \
            --head "${BRANCH}" \
            --title "chore(release): sync changelog ${TAG_NAME}" \
            --body "Sync CHANGELOG.md for ${TAG_NAME}"

      - name: Output release status
        run: |
          TAG_NAME="${{ steps.get-tag.outputs.tag_name }}"
          VERSION="${{ steps.get-tag.outputs.version }}"
          
          if [ -n "$TAG_NAME" ] && [ -n "$VERSION" ]; then
            echo "✅ Tag created: $TAG_NAME"
            echo "✅ Version: $VERSION"
            echo "✅ Changelog updated in CHANGELOG.md"
            echo "✅ Se creo el PR a develop para actualizar esa rama con el changelog resultante"
            echo "ℹ️ No GitHub Release created (will be created manually later)"
            echo ""
            echo "📦 Next steps:"
            echo "1. Review the tag: $TAG_NAME"
            echo "2. Review the changelog in CHANGELOG.md"
            echo "3. Manually create a GitHub Release using the 'Create Release' workflow"
          else
            echo "ℹ️ No new tag created"
            echo "ℹ️ This is normal if:"
            echo "   - There are no changes since the last release"
            echo "   - Commits don't follow Conventional Commits format"
            echo "   - Version already exists"
          fi

      
