name: PHP Coverage Validation

on:
  workflow_call:
    inputs:
      threshold:
        description: 'Minimum coverage percentage'
        required: false
        type: number
        default: 80
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  php-coverage-validation:
    name: PHP Coverage Validation
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-php
          path: .

      - name: Validate PHP Coverage
        run: |
          if [ ! -f "coverage.xml" ]; then
            echo "❌ ERROR: coverage.xml not found"
            echo "Unit tests must generate coverage.xml file"
            exit 1
          fi
          
          echo "Coverage file found, validating threshold of ${{ inputs.threshold }}%"
          
          # Parse PHPUnit coverage.xml (Clover format)
          # Method 1: Try to get line-rate directly (if present)
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage.xml | head -1)
          
          if [ -z "$COVERAGE" ]; then
            # Method 2: Calculate from coveredstatements/statements
            # Get values from the project-level metrics (most accurate)
            # First try to get from the project metrics element
            COVERED_STATEMENTS=$(grep -oP 'coveredstatements="\K[0-9]+' coverage.xml | tail -1)
            TOTAL_STATEMENTS=$(grep -oP 'statements="\K[0-9]+' coverage.xml | tail -1)
            
            # If still empty, try getting from any metrics element
            if [ -z "$COVERED_STATEMENTS" ] || [ -z "$TOTAL_STATEMENTS" ]; then
              COVERED_STATEMENTS=$(grep -oP 'coveredstatements="\K[0-9]+' coverage.xml | head -1)
              TOTAL_STATEMENTS=$(grep -oP 'statements="\K[0-9]+' coverage.xml | head -1)
            fi
            
            if [ -n "$COVERED_STATEMENTS" ] && [ -n "$TOTAL_STATEMENTS" ] && [ "$TOTAL_STATEMENTS" -gt 0 ]; then
              COVERAGE=$(python3 -c "print($COVERED_STATEMENTS / $TOTAL_STATEMENTS)")
              echo "Calculated coverage from statements: $COVERED_STATEMENTS / $TOTAL_STATEMENTS = $COVERAGE"
            fi
          fi
          
          if [ -z "$COVERAGE" ]; then
            echo "⚠️ Could not parse coverage from coverage.xml"
            echo "Attempting to show file structure:"
            head -30 coverage.xml
            echo ""
            echo "Trying alternative parsing methods..."
            # Try to find any metrics element
            grep -i "statements\|coverage\|metrics" coverage.xml | head -5
            exit 1
          fi
          
          # Calculate percentage and validate
          COVERAGE_PERCENT=$(python3 -c "print(int(float('$COVERAGE') * 100))")
          echo "Current coverage: ${COVERAGE_PERCENT}%"
          echo "Required threshold: ${{ inputs.threshold }}%"
          
          if [ "$COVERAGE_PERCENT" -lt "${{ inputs.threshold }}" ]; then
            echo "❌ Coverage validation failed: ${COVERAGE_PERCENT}% < ${{ inputs.threshold }}%"
            exit 1
          fi
          
          echo "✅ Coverage validation passed: ${COVERAGE_PERCENT}% >= ${{ inputs.threshold }}%"

