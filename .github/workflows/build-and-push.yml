name: Build and Push

on:
  workflow_call:
    inputs:
      ecr_repository_url:
        description: 'ECR repository URL'
        required: true
        type: string
      aws_role_arn:
        description: 'AWS IAM role ARN for ECR access'
        required: true
        type: string
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'us-east-1'
      service_name:
        description: 'Service name'
        required: false
        type: string
        default: ''
      branch:
        description: 'Branch name (develop or main)'
        required: true
        type: string
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    name: Build and Push to ECR
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          if [ "${{ inputs.branch }}" = "develop" ]; then
            echo "tags=${{ inputs.ecr_repository_url }}:${SHORT_SHA},${{ inputs.ecr_repository_url }}:develop-latest" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.branch }}" = "main" ]; then
            # Get the latest tag (should be the one just created by release-please)
            # Fetch all tags first
            git fetch --tags
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Using version tag: $VERSION"
            # Create tags: version, version-stg, version-prd
            echo "tags=${{ inputs.ecr_repository_url }}:${VERSION},${{ inputs.ecr_repository_url }}:${VERSION}-stg,${{ inputs.ecr_repository_url }}:${VERSION}-prd" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ inputs.ecr_repository_url }}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ inputs.ecr_repository_url }}:buildcache
          cache-to: type=registry,ref=${{ inputs.ecr_repository_url }}:buildcache,mode=max

      - name: Output image information
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

