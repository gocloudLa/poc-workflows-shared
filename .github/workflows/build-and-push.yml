name: Build and Push

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Service name'
        required: false
        type: string
        default: ''
      branch:
        description: 'Branch name (develop or main)'
        required: true
        type: string
      version_tag:
        description: 'Version tag created by release job (e.g., v1.2.3)'
        required: false
        type: string
        default: ''
      skip_execution:
        required: false
        type: boolean
        default: false
    outputs:
      image_tag:
        description: 'Image tag without registry (short SHA or version tag)'
        value: ${{ jobs.build-and-push.outputs.image_tag }}
      image_digest:
        description: 'Built image digest'
        value: ${{ jobs.build-and-push.outputs.image_digest }}
      version_tag:
        description: 'Version tag for main branch builds'
        value: ${{ jobs.build-and-push.outputs.version_tag }}

jobs:
  build-and-push:
    name: Build and Push to ECR
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag_only }}
      image_digest: ${{ steps.build.outputs.digest }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        env:
          AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_SHARED }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR login token and login to Docker
        id: ecr-docker-login
        run: |
          ECR_REGISTRY=$(echo "${{ secrets.ECR_REPOSITORY_URL }}" | cut -d'/' -f1)
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }})
          echo "$ECR_TOKEN" | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        run: |
          ECR_REPO="${{ secrets.ECR_REPOSITORY_URL }}"
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          if [ "${{ inputs.branch }}" = "develop" ]; then
            echo "tags=${ECR_REPO}:${SHORT_SHA},${ECR_REPO}:develop-latest" >> $GITHUB_OUTPUT
            # Output only the tag (without ECR URL) for job output to avoid secret detection
            echo "tag_only=${SHORT_SHA}" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.branch }}" = "main" ]; then
            # Get the latest tag (should be the one just created by release-please)
            # Fetch all tags first
            git fetch --tags
            if [ -n "${{ inputs.version_tag }}" ]; then
              VERSION="${{ inputs.version_tag }}"
            else
              VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            fi
            echo "Using version tag: $VERSION"
            # Output version tag separately for easier access
            echo "version_tag=${VERSION}" >> $GITHUB_OUTPUT
            # Create tags: version, version-stg, version-prd
            echo "tags=${ECR_REPO}:${VERSION},${ECR_REPO}:${VERSION}-stg,${ECR_REPO}:${VERSION}-prd" >> $GITHUB_OUTPUT
            # Output only the tag (without ECR URL) for job output to avoid secret detection
            echo "tag_only=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tags=${ECR_REPO}:${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "tag_only=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.ECR_REPOSITORY_URL }}:buildcache
          cache-to: type=registry,ref=${{ secrets.ECR_REPOSITORY_URL }}:buildcache,mode=max

      - name: Output image information
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"
