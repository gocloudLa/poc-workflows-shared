name: Deploy to Dev

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Service name'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  deploy-dev:
    name: Deploy to Dev Environment
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        env:
          AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}

      - name: Simulate Deployment to Dev
        env:
          AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
        run: |
          echo "🚀 Simulating deployment to DEV environment"
          echo "Service: ${{ inputs.service_name }}"
          echo "Image: ${{ secrets.ECR_REPOSITORY_URL }}:${{ inputs.image_tag }}"
          echo "Environment: dev"
          echo "Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "In a real scenario, this would:"
          echo "1. Update ECS task definition or Kubernetes deployment"
          echo "2. Trigger ArgoCD sync (if using GitOps)"
          echo "3. Update Lambda function (if applicable)"
          echo "4. Wait for deployment to complete"
          echo ""
          echo "✅ Deployment simulation completed"

      - name: Log deployment to Datadog
        run: |
          echo "📊 Logging deployment event to Datadog (simulated)"
          echo "Event: Service ${{ inputs.service_name }} deployed to dev"
          echo "Version: ${{ inputs.image_tag }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

