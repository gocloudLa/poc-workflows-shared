name: Deploy

on:
  workflow_call:
    inputs:
      target_repository:
        description: 'Repository to update (owner/repo)'
        required: true
        type: string
      target_branch:
        description: 'Target branch to update'
        required: false
        type: string
        default: 'main'
      values_dir:
        description: 'Folder that contains values files (relative to repo root)'
        required: false
        type: string
        default: ''
      environment:
        description: 'Environment used to pick values.<env>.yaml (dev, staging, prd)'
        required: true
        type: string
      values_file:
        description: 'Optional override for values file name (e.g. values.dev.yaml)'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Image tag to write into the values file'
        required: true
        type: string
      image_tag_key:
        description: 'YQ path for the image tag key (e.g. image.tag)'
        required: false
        type: string
        default: 'image.tag'
      commit_message:
        description: 'Commit message override'
        required: false
        type: string
        default: ''
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  commit-image:
    name: Commit image tag
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Parse target repository
        id: target-repo
        run: |
          set -euo pipefail
          FULL="${{ inputs.target_repository }}"
          OWNER="${FULL%%/*}"
          REPO="${FULL#*/}"
          if [ -z "$OWNER" ] || [ -z "$REPO" ] || [ "$OWNER" = "$REPO" ]; then
            echo "Invalid target_repository: $FULL" >&2
            exit 1
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACTION_BOT_APP_ID }}
          private-key: ${{ secrets.ACTION_BOT_PRIVATE_KEY }}
          owner: ${{ steps.target-repo.outputs.owner }}
          repositories: ${{ steps.target-repo.outputs.repo }}
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Resolve values file path
        id: values
        run: |
          if [ -n "${{ inputs.values_file }}" ]; then
            FILE="${{ inputs.values_file }}"
          else
            FILE="values.${{ inputs.environment }}.yaml"
          fi
          if [ -n "${{ inputs.values_dir }}" ]; then
            FILE="${{ inputs.values_dir }}/$FILE"
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Install yq
        uses: mikefarah/yq@v4.53.3

      - name: Update values file
        run: |
          set -euo pipefail
          FILE="${{ steps.values.outputs.file }}"
          if [ ! -f "$FILE" ]; then
            echo "Values file not found: $FILE" >&2
            exit 1
          fi
          yq eval -i ".${{ inputs.image_tag_key }} = \"${{ inputs.image_tag }}\"" "$FILE"

      - name: Commit and push
        run: |
          set -euo pipefail
          FILE="${{ steps.values.outputs.file }}"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          MESSAGE="${{ inputs.commit_message }}"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="chore: update image tag for ${{ inputs.environment }} to ${{ inputs.image_tag }}"
          fi
          git commit -m "$MESSAGE"
          git push origin "${{ inputs.target_branch }}"
