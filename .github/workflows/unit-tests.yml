name: Unit Tests

on:
  workflow_call:
    inputs:
      language:
        description: 'Programming language'
        required: true
        type: string
      skip_execution:
        required: false
        type: boolean
        default: false

jobs:
  unit-tests:
    name: Unit Tests (${{ inputs.language }})
    if: ${{ !inputs.skip_execution }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        if: ${{ inputs.language == 'php' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug

      - name: Run PHP Tests
        if: ${{ inputs.language == 'php' }}
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-interaction --prefer-dist
            vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml || true
          else
            echo "No composer.json found, skipping PHP tests"
          fi

      - name: Setup Python
        if: ${{ inputs.language == 'python' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run Python Tests
        if: ${{ inputs.language == 'python' }}
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml --cov-report=term || true

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: |
            coverage.xml
          fail_ci_if_error: false

